<!DOCTYPE html>
<html lang="pt-br">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Acesso Administrativo - Canaã Soluções Agrícolas</title>
	<meta name="robots" content="noindex, nofollow" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; base-uri 'self'; form-action 'self'" />

	<link rel="stylesheet" href="./css/reset.css" />
	<link rel="stylesheet" href="./css/variables.css" />
	<link rel="stylesheet" href="./css/base.css" />
	<link rel="stylesheet" href="./css/components/admin.css" />
	<script src="./js/security.js" defer></script>
</head>

<body class="login-body">
	<main class="login-card">
		<div class="login-header">
			<a href="./index.html" title="Voltar ao início">
				<img src="./images/logo/logo-canaa-agricola.svg" alt="Canaã Soluções Agrícolas" class="login-logo" />
			</a>
			<h1 class="login-title">Painel Administrativo</h1>
			<p class="login-subtitle">Entre com suas credenciais para gerenciar os produtos e conteúdos.</p>
		</div>

		<div id="login-alert" class="login-alert" role="alert"></div>

		<form id="login-form" class="login-form" autocomplete="on">
			<div class="form-group">
				<label for="username">E-mail de Acesso</label>
				<div class="input-wrapper">
					<input type="email" id="username" class="form-control" placeholder="Digite seu e-mail" required autofocus autocomplete="username" />
				</div>
			</div>

			<div class="form-group">
				<label for="password">Senha</label>
				<div class="input-wrapper">
					<input type="password" id="password" class="form-control" placeholder="Digite sua senha" required autocomplete="current-password" />
					<button type="button" id="toggle-password" class="toggle-password-btn" aria-label="Mostrar ou ocultar senha">👁️</button>
				</div>
			</div>

			<button type="submit" class="login-btn">
				<span>Entrar no Painel</span>
				<span>&rarr;</span>
			</button>
		</form>

		<div class="login-footer">
			<a href="./index.html">
				<span>&larr; Voltar para a Loja</span>
			</a>
		</div>
	</main>

	<script>
		// Redirecionar se já logado
		if (sessionStorage.getItem('canaa_admin_logged') === 'true') {
			window.location.href = './admin.html';
		}

		const loginForm = document.getElementById('login-form');
		const alertBox = document.getElementById('login-alert');
		const togglePasswordBtn = document.getElementById('toggle-password');
		const passwordInput = document.getElementById('password');

		// Toggle de visibilidade de senha
		togglePasswordBtn.addEventListener('click', () => {
			const isPassword = passwordInput.type === 'password';
			passwordInput.type = isPassword ? 'text' : 'password';
			togglePasswordBtn.textContent = isPassword ? '🙈' : '👁️';
		});

		// Handler de submissão do formulário
		loginForm.addEventListener('submit', (e) => {
			e.preventDefault();

			// Verificar se a conta está bloqueada por tentativas
			if (isAccountLocked()) {
				alertBox.className = 'login-alert error';
				alertBox.textContent = '❌ Muitas tentativas falhadas. Tente novamente em 5 minutos.';
				alertBox.style.display = 'flex';
				return;
			}

			const username = document.getElementById('username').value.trim();
			const password = passwordInput.value;

			// Validar campos vazios
			if (!username || !password) {
				alertBox.className = 'login-alert error';
				alertBox.textContent = '⚠️ Por favor, preencha todos os campos.';
				alertBox.style.display = 'flex';
				return;
			}

			// Obter credenciais do localStorage
			const validUser = localStorage.getItem('canaa_admin_user');
			const validPass = localStorage.getItem('canaa_admin_pass');

			if (!validUser || !validPass) {
				alertBox.className = 'login-alert error';
				alertBox.textContent = '⚠️ Sistema não configurado. Contate o administrador.';
				alertBox.style.display = 'flex';
				return;
			}

			// Validar credenciais
			if (username.toLowerCase() === validUser.toLowerCase() && password === validPass) {
				clearLoginAttempts();
				alertBox.className = 'login-alert info';
				alertBox.textContent = '✓ Autenticado com sucesso! Redirecionando...';
				alertBox.style.display = 'flex';

				const sessionStart = new Date().toISOString();
				sessionStorage.setItem('canaa_admin_logged', 'true');
				sessionStorage.setItem('canaa_session_start', sessionStart);
				
				logSecurityEvent('admin_login', { email: username, success: true });

				setTimeout(() => {
					window.location.href = './admin.html';
				}, 600);
			} else {
				recordFailedAttempt();
				const attempts = getLoginAttempts();
				const remaining = Math.max(0, SECURITY_CONFIG.MAX_ATTEMPTS - attempts.count);

				alertBox.className = 'login-alert error';
				if (remaining > 0) {
					alertBox.textContent = `❌ Credenciais incorretas. Tentativas restantes: ${remaining}`;
				} else {
					alertBox.textContent = '❌ Muitas tentativas falhadas. Tente novamente em 5 minutos.';
				}
				alertBox.style.display = 'flex';
				
				logSecurityEvent('admin_login', { email: username, success: false });
				
				passwordInput.value = '';
				passwordInput.focus();
			}
		});
	</script>
</body>

</html>
