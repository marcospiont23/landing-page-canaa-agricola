<!DOCTYPE html>
<html lang="pt-br">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Acesso Administrativo - Canaã Soluções Agrícolas</title>
	<meta name="robots" content="noindex, nofollow" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self'; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://sjoxvmfmofdyecqnzhfe.supabase.co; base-uri 'self'; form-action 'self'" />

	<link rel="stylesheet" href="./css/reset.css" />
	<link rel="stylesheet" href="./css/variables.css" />
	<link rel="stylesheet" href="./css/base.css" />
	<link rel="stylesheet" href="./css/components/admin.css" />
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
	<script src="./js/supabase.js" defer></script>
	<script src="./js/security.js" defer></script>
	<script src="./js/login.js" defer></script>
</head>

<body class="login-body">
	<main class="login-card">
		<div class="login-header">
			<a href="./index.html" title="Voltar ao início">
				<img src="./images/logo/logo-canaa-agricola.svg" alt="Canaã Soluções Agrícolas" class="login-logo" />
			</a>
			<h1 class="login-title">Painel Administrativo</h1>
			<p class="login-subtitle">Entre com suas credenciais para gerenciar os produtos e conteúdos.</p>
		</div>

		<div id="login-alert" class="login-alert" role="alert"></div>

		<form id="login-form" class="login-form" autocomplete="on">
			<div class="form-group">
				<label for="username">E-mail de Acesso</label>
				<div class="input-wrapper">
					<input type="email" id="username" class="form-control" placeholder="Digite seu e-mail" required autofocus autocomplete="username" />
				</div>
			</div>

			<div class="form-group">
				<label for="password">Senha</label>
				<div class="input-wrapper">
					<input type="password" id="password" class="form-control" placeholder="Digite sua senha" required autocomplete="current-password" />
					<button type="button" id="toggle-password" class="toggle-password-btn" aria-label="Mostrar ou ocultar senha">👁️</button>
				</div>
			</div>

			<button type="submit" class="login-btn">
				<span>Entrar no Painel</span>
				<span>&rarr;</span>
			</button>
		</form>

		<div class="login-footer">
			<a href="./index.html">
				<span>&larr; Voltar para a Loja</span>
			</a>
		</div>
	</main>

</body>

</html>
